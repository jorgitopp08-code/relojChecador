name: Deploy to Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create production config
        shell: bash
        env:
          APP_CONFIG_PHP: ${{ secrets.APP_CONFIG_PHP }}
        run: |
          if [ -z "$APP_CONFIG_PHP" ]; then
            echo "Missing APP_CONFIG_PHP secret."
            exit 1
          fi
          printf "%s" "$APP_CONFIG_PHP" > config.php

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp-repoclase.alwaysdata.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: www/
          protocol: ftps
          timeout: 86400000
          log-level: standard
          exclude: |
            .git/**
            .github/**
